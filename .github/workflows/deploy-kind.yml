# Secure deployment of goof to a throwaway kind (Kubernetes-in-Docker) cluster on the runner.
# Builds the hardened image, scans it and the Kubernetes manifests with Snyk, deploys, then proves
# the security controls with automated checks. Nothing runs on a laptop.
name: Secure deploy (kind)

on:
  push:
    branches: [secure-deploy, main]
    paths: [Dockerfile.secure, k8s/**, deploy/**, .github/workflows/deploy-kind.yml, package.json, package-lock.json, "*.js", routes/**, views/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kind-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: goof-secure:local
  CALICO_VERSION: v3.33.0

jobs:
  deploy:
    name: Build, scan, deploy, verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------- build ----------
      - name: Build hardened image
        run: docker build -f Dockerfile.secure -t "$IMAGE" .

      # ---------- scan (report-only; the counts go to the job summary) ----------
      - name: Install Snyk CLI
        uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            snyk = "1.1308.4"

      - name: Snyk Container + IaC scans
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -z "$SNYK_TOKEN" ]]; then
            echo "::warning title=Snyk skipped::No SNYK_TOKEN secret; skipping the scans."
            exit 0
          fi
          count() {  # file label -> "label | critical | high | medium | low"
            python3 - "$1" "$2" <<'PY'
          import json, sys, collections
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              print(f"| {sys.argv[2]} | scan failed | | | |"); raise SystemExit
          runs = d if isinstance(d, list) else [d]
          c = collections.Counter()
          for r in runs:
              items = r.get("vulnerabilities") or r.get("infrastructureAsCodeIssues") or []
              for x in {(i.get("id"), i.get("packageName", ""), i.get("path", "") if isinstance(i.get("path"), str) else str(i.get("path"))): i for i in items}.values():
                  c[x.get("severity", "?")] += 1
          print(f"| {sys.argv[2]} | {c['critical']} | {c['high']} | {c['medium']} | {c['low']} |")
          PY
          }
          snyk container test node:18.13.0 --exclude-app-vulns --json > upstream.json || true
          snyk container test "$IMAGE" --file=Dockerfile.secure --exclude-app-vulns --json > hardened.json || true
          snyk iac test k8s/ --json > iac.json || true
          {
            echo "## Snyk scans"
            echo
            echo "| Scan | Critical | High | Medium | Low |"
            echo "|---|---:|---:|---:|---:|"
            count upstream.json "Upstream base image node:18.13.0 (OS packages)"
            count hardened.json "Hardened image $IMAGE (OS packages)"
            count iac.json "Kubernetes manifests k8s/ (IaC)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------- cluster ----------
      - name: Create kind cluster (no default CNI)
        uses: helm/kind-action@v1.15.2
        with:
          cluster_name: goof
          config: deploy/kind-config.yaml
          wait: 0s

      - name: Install Calico (enforces NetworkPolicy)
        run: |
          kubectl apply -f "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=180s

      # ---------- deploy ----------
      - name: Deploy
        run: |
          kind load docker-image "$IMAGE" --name goof
          kubectl apply -f k8s/goof.yaml
          kubectl -n goof create secret generic goof-mongo-auth \
            --from-literal=username=goof \
            --from-literal=password="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
          kubectl -n goof rollout status deploy/goof-mongo --timeout=240s
          kubectl -n goof rollout status deploy/goof --timeout=240s
          kubectl -n goof get pods -o wide

      # ---------- verify the security controls ----------
      - name: Verify
        run: |
          set -u
          pass=0; fail=0; rows=()
          check() {  # name, expected-outcome description, command...
            local name=$1 want=$2; shift 2
            if "$@" > /tmp/out 2>&1; then rows+=("| $name | ✅ | $want |"); pass=$((pass+1))
            else rows+=("| $name | ❌ | $want: $(tr '\n' ' ' < /tmp/out | cut -c1-120) |"); fail=$((fail+1)); fi
          }
          POD=$(kubectl -n goof get pod -l app=goof -o jsonpath='{.items[0].metadata.name}')

          kubectl -n goof port-forward svc/goof 3001:80 >/dev/null 2>&1 &
          sleep 5
          check "App responds" "HTTP 200 on /" \
            bash -c 'test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/)" = 200'

          check "Runs as non-root" "uid 10001" \
            bash -c "test \"\$(kubectl -n goof exec $POD -- id -u)\" = 10001"

          check "Read-only root filesystem" "write to /app fails: Read-only file system" \
            bash -c "kubectl -n goof exec $POD -- sh -c 'echo x > /app/pwned' 2>&1 | grep -q 'Read-only file system'"

          check "No npm in runtime image" "npm not found" \
            bash -c "! kubectl -n goof exec $POD -- sh -c 'command -v npm'"

          check "No service-account token" "token not mounted" \
            bash -c "! kubectl -n goof exec $POD -- test -e /var/run/secrets/kubernetes.io/serviceaccount/token"

          check "App can reach MongoDB" "allowed by policy" \
            kubectl -n goof exec $POD -- node -e "require('net').connect(27017,'goof-mongo',function(){process.exit(0)}).on('error',function(){process.exit(1)});setTimeout(function(){process.exit(1)},5000)"

          # A pod without the app's label must not reach MongoDB (default-deny + allow-list).
          kubectl -n goof run netcheck --image=busybox:1.36 --restart=Never \
            --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":65534,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"netcheck","image":"busybox:1.36","command":["sleep","120"],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}' >/dev/null
          kubectl -n goof wait --for=condition=Ready pod/netcheck --timeout=90s >/dev/null
          check "Other pods can't reach MongoDB" "connection blocked (nc exit 1)" \
            bash -c "kubectl -n goof exec netcheck -- sh -c 'nc -z -w 3 goof-mongo 27017; echo rc=\$?' | grep -qx 'rc=1'"

          # Pod Security Admission: a privileged pod must be rejected in this namespace.
          check "Privileged pod rejected" "violates PodSecurity restricted" \
            bash -c "kubectl -n goof run evil --image=busybox:1.36 --restart=Never --overrides='{\"spec\":{\"containers\":[{\"name\":\"evil\",\"image\":\"busybox:1.36\",\"command\":[\"sleep\",\"1\"],\"securityContext\":{\"privileged\":true}}]}}' 2>&1 | grep -q 'violates PodSecurity'"

          {
            echo "## Security checks ($pass passed, $fail failed)"
            echo
            echo "| Check | Result | Expected |"
            echo "|---|:---:|---|"
            printf '%s\n' "${rows[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $fail -eq 0 ]]

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n goof describe pods || true
          kubectl -n goof logs deploy/goof --tail=100 || true
          kubectl -n goof logs deploy/goof-mongo --tail=50 || true
          kubectl -n goof get events --sort-by=.lastTimestamp | tail -30 || true
